<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>{% block title %}WatchPol{% endblock %}</title>
  <link rel="icon" href="{{ url_for('static', filename='favicon.png') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='vendor/leaflet/leaflet.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <aside class="sidebar">
    <a class="brand" href="{{ url_for('index') }}">
      <img src="{{ url_for('static', filename='logo.jpg') }}" alt="WatchPol Logo" width="44" height="44">
      <span class="brand-text">
        <strong>WatchPol</strong>
        <small>Gegenüberwachung · Berlin</small>
      </span>
    </a>

    <nav class="nav" aria-label="Hauptnavigation">
      {% if role == 'view' %}
      <a href="{{ url_for('view_page') }}" class="{{ 'active' if request.endpoint == 'view_page' }}">
        <i class="nav-dot"></i><span>Karte</span></a>
      {% endif %}
      {% if role %}
      <a href="{{ url_for('input_page') }}" class="{{ 'active' if request.endpoint == 'input_page' }}">
        <i class="nav-dot"></i><span>Vorfall melden</span></a>
      {% endif %}
    </nav>

    {% if role == 'view' %}
    <dl class="stats" id="stats">
      <div><dt>Meldungen gesamt</dt><dd data-stat="total" class="hl">–</dd></div>
      <div><dt>Letzte 24h</dt><dd data-stat="last_24h">–</dd></div>
      <div><dt>Verifiziert</dt><dd data-stat="verified">–</dd></div>
    </dl>
    {% endif %}
  </aside>

  <main class="main">{% block content %}{% endblock %}</main>

  <script src="{{ url_for('static', filename='vendor/leaflet/leaflet.js') }}"></script>
  {% if cfg %}<script>window.APP_CONFIG = {{ cfg | tojson }};</script>{% endif %}
  <script src="{{ url_for('static', filename='common.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
